name: DVA-C02 Daily Question

on:
  schedule:
    # 00:30 UTC = 05:30 AM IST
    - cron: '30 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-question:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r dva-c02-daily/requirements.txt

      - name: Send daily question
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python dva-c02-daily/send_question.py
